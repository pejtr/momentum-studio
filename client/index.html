<!doctype html>
<html lang="cs">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>OMNIMATRIX // QA Automation Core</title>
    <meta name="description" content="OMNIMATRIX: Pokročilý AI-powered QA automation core pro testování, workflow automatizaci a inteligentní spouštění skriptů. Platforma nové generace s podporou více platforem." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&family=Orbitron:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (() => {
        const analyticsEndpoint = "%VITE_ANALYTICS_ENDPOINT%";
        const websiteId = "%VITE_ANALYTICS_WEBSITE_ID%";
        const previewHostSuffixes = [
          ".manus.computer",
          ".manuspre.computer",
          ".manus-asia.computer",
          ".manuscomputer.ai",
          ".manusvm.computer",
        ];
        const isLocalPreview =
          ["localhost", "127.0.0.1"].includes(window.location.hostname) ||
          previewHostSuffixes.some((suffix) => window.location.hostname.endsWith(suffix));
        const hasConfiguration =
          analyticsEndpoint.length > 0 &&
          websiteId.length > 0 &&
          !analyticsEndpoint.includes("%VITE_") &&
          !websiteId.includes("%VITE_");

        // Local preview hosts are not registered analytics websites. Avoid
        // sending noise/400 responses there while retaining production tracking.
        if (!isLocalPreview && hasConfiguration) {
          const script = document.createElement("script");
          script.defer = true;
          script.src = `${analyticsEndpoint}/umami`;
          script.dataset.websiteId = websiteId;
          document.head.appendChild(script);
        }
      })();
    </script>
  </body>

</html>
